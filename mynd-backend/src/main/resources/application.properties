# Keycloak
%prod.quarkus.oidc.auth-server-url=${KEYCLOAK_URL}/realms/${KEYCLOAK_REALM}
%prod.quarkus.oidc.client-id=${KEYCLOAK_CLIENT_ID}
%dev.quarkus.oidc.auth-server-url=${KEYCLOAK_URL}/realms/${KEYCLOAK_REALM}
%dev.quarkus.oidc.client-id=${KEYCLOAK_CLIENT_ID}
quarkus.oidc.application-type=service
quarkus.oidc.roles.source=accesstoken

quarkus.keycloak.admin-client.server-url=${KEYCLOAK_URL}
quarkus.keycloak.admin-client.realm=${KEYCLOAK_REALM}
quarkus.keycloak.admin-client.client-id=${KEYCLOAK_BACKEND_CLIENT_ID}
quarkus.keycloak.admin-client.grant-type=client_credentials
quarkus.keycloak.admin-client.client-secret=${KEYCLOAK_BACKEND_CLIENT_SECRET}

# Server
%dev.quarkus.http.cors.enabled=true
%dev.quarkus.http.cors.origins=http://localhost:5173

# Database
quarkus.datasource.db-kind=postgresql

%prod.quarkus.datasource.username=${DB_USER}
%prod.quarkus.datasource.password=${DB_PASSWORD}
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST}:5432/${DB_NAME}
%dev.quarkus.datasource.username=${DB_USER}
%dev.quarkus.datasource.password=${DB_PASSWORD}
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST}:5432/${DB_NAME}

# Hibernate Strategy
%prod.quarkus.hibernate-orm.database.generation=none
%dev.quarkus.hibernate-orm.database.generation=update
%test.quarkus.hibernate-orm.database.generation=drop-and-create