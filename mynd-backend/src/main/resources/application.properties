# Keycloak
%prod.quarkus.oidc.auth-server-url=${KEYCLOAK_URL}/realms/${KEYCLOAK_REALM}
%prod.quarkus.oidc.client-id=${KEYCLOAK_CLIENT_ID}
%dev.quarkus.oidc.auth-server-url=${KEYCLOAK_URL}/realms/${KEYCLOAK_REALM}
%dev.quarkus.oidc.client-id=${KEYCLOAK_CLIENT_ID}
quarkus.oidc.application-type=service
quarkus.oidc.roles.source=accesstoken
quarkus.oidc.roles.role-claim-path=resource_access/mynd/roles

quarkus.keycloak.admin-client.server-url=${KEYCLOAK_URL}
quarkus.keycloak.admin-client.realm=${KEYCLOAK_REALM}
quarkus.keycloak.admin-client.client-id=${KEYCLOAK_BACKEND_CLIENT_ID}
quarkus.keycloak.admin-client.grant-type=client_credentials
quarkus.keycloak.admin-client.client-secret=${KEYCLOAK_BACKEND_CLIENT_SECRET}

# Server
quarkus.http.cors.enabled=true
quarkus.http.limits.max-body-size=110M
quarkus.native.resources.includes=**
%dev.quarkus.http.cors.origins=http://localhost:5173
%prod.quarkus.http.cors.origins=${CORS_ORIGIN}

# OpenAPI
quarkus.smallrye-openapi.enable=true
quarkus.smallrye-openapi.info-version=${APP_VERSION:development}

# Flyway
quarkus.flyway.clean-at-start=true
quarkus.flyway.migrate-at-start=true
quarkus.flyway.validate-migration-naming=true

# Database
quarkus.datasource.devservices.image-name=pgvector/pgvector:pg18
quarkus.datasource.db-kind=postgresql

%prod.quarkus.datasource.username=${DB_USER}
%prod.quarkus.datasource.password=${DB_PASSWORD}
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST}:5432/${DB_NAME}
%dev.quarkus.datasource.username=${DB_USER}
%dev.quarkus.datasource.password=${DB_PASSWORD}
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST}:5432/${DB_NAME}

# Hibernate Strategy
quarkus.hibernate-orm.database.generation=validate

# S3
quarkus.s3.endpoint-override=${S3_HOST}
quarkus.s3.aws.region=eu-central-1
quarkus.s3.aws.credentials.type=static
quarkus.s3.aws.credentials.static-provider.access-key-id=${S3_ACCESS_KEY}
quarkus.s3.aws.credentials.static-provider.secret-access-key=${S3_SECRET}
quarkus.s3.path-style-access=true
quarkus.s3.async-client.type=netty

# Mailer
%dev.quarkus.mailer.mock=false
quarkus.mailer.host=${MAILER_HOST:127.0.0.1}
quarkus.mailer.port=${MAILER_PORT:1025}
quarkus.mailer.username=${MAILER_USERNAME:noreply@mynd.local}
quarkus.mailer.from=MYnd <${MAILER_FROM:noreply@mynd.local}>
%prod.quarkus.mailer.password=${MAILER_PASSWORD}
%prod.quarkus.mailer.start-tls=REQUIRED

# Stripe
stripe.api.key=${STRIPE_API_KEY:apiKey}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:webhookSecret}

# MYnd
mynd.s3.bucket=default
mynd.s3.public-host=${S3_HOST_PUBLIC}
mynd.loadDemoContent=true
mynd.frontendUri=${FRONTEND_URI}
mynd.trialDays=7
mynd.invitations.buidlerRegisterReward=20
mynd.invitations.learnerRegisterReward=3