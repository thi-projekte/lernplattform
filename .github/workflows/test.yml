name: Test

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci
      - name: Lint & Format Check
        run: |
          npm run lint
          npm run format:check

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mynd-backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Check Formatting (Spotless/Checkstyle)
        run: ./mvnw spotless:check
      - name: Run Quarkus Tests
        run: ./mvnw test
