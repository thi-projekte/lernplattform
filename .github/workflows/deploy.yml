name: Push images to registry
on:
  release:
    types:
      - created

jobs:
  build-and-push-backend:
    name: Build and push backend image to registry
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Setup GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: 21
          distribution: 'graalvm-community'
          cache: maven

      - name: Verify backend
        working-directory: mynd-backend
        run: |
          chmod +x mvnw
          ./mvnw verify -B

      - name: Build backend
        working-directory: mynd-backend
        run: |
          chmod +x mvnw
          ./mvnw package -Dnative -DskipTests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./mynd-backend
          file: mynd-backend/src/main/docker/Dockerfile.native-micro
          push: true
          load: true
          tags: ghcr.io/thi-projekte/lernplattform-mynd-backend:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-and-push-frontend:
    name: Build and push frontend image to registry
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          load: true
          tags: ghcr.io/thi-projekte/lernplattform-mynd-frontend:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_KEYCLOAK_URL=${{ secrets.KEYCLOAK_URL }}
            VITE_KEYCLOAK_REALM=master
            VITE_KEYCLOAK_CLIENT_ID=mynd
            VITE_MYND_BACKEND_URI=${{ secrets.MYND_BACKEND_URL }}
  
  


  build-and-push-keycloak:
    name: Build and push keycloak image to registry
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./keycloak/Dockerfile
          push: true
          load: true
          tags: ghcr.io/thi-projekte/lernplattform-mynd-keycloak:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  deploy-to-portainer:
    needs:
      - build-and-push-backend
      - build-and-push-frontend
      - build-and-push-keycloak
    name: Trigger deploy
    uses: ./.github/workflows/portainer.yml
    with:
      image_tag: ${{ github.ref_name }}
    secrets: inherit
