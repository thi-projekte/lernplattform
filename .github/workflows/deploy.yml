name: Deploy to Portainer
on:
  push:
    branches:
      - main

jobs:
  build-and-push-backend:
    name: Build and push backend image to registry
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Setup GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: 21
          distribution: 'graalvm-community'
          cache: maven

      - name: Verify backend
        working-directory: mynd-backend
        run: |
          chmod +x mvnw
          ./mvnw verify -B

      - name: Build backend
        working-directory: mynd-backend
        run: |
          chmod +x mvnw
          ./mvnw package -Dnative -DskipTests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./mynd-backend
          file: mynd-backend/src/main/docker/Dockerfile.native-micro
          push: true
          load: true
          tags: ghcr.io/thi-projekte/lernplattform-mynd-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-and-push-frontend:
    name: Build and push frontend image to registry
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          load: true
          tags: ghcr.io/thi-projekte/lernplattform-mynd-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_KEYCLOAK_URL=${{ secrets.KEYCLOAK_URL }}
            VITE_KEYCLOAK_REALM=master
            VITE_KEYCLOAK_CLIENT_ID=mynd
            VITE_MYND_BACKEND_URI=${{ secrets.MYND_BACKEND_URL }}

  deploy-to-portainer:
    needs:
      - build-and-push-backend
      - build-and-push-frontend
    name: Deploy to portainer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Deploy stack
        uses: cssnr/portainer-stack-deploy-action@v1
        with:
          url: ${{ secrets.PORTAINER_URL }}
          token: ${{ secrets.PORTAINER_TOKEN }}
          endpoint: ${{ secrets.PORTAINER_ENDPOINT || '3' }}
          name: MYnd Lernplattform
          file: portainer/full/docker-compose.yml
          pull: 'true'
          type: file
          env_data: |
            {
              "KEYCLOAK_DB_PASSWORD": "${{ secrets.KEYCLOAK_DB_PASSWORD }}",
              "KEYCLOAK_ADMIN_USER": "${{ secrets.KEYCLOAK_ADMIN_USER }}",
              "KEYCLOAK_ADMIN_PASSWORD": "${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}",
              "S3_ACCESS_KEY": "${{ secrets.S3_ACCESS_KEY }}",
              "S3_SECRET_KEY": "${{ secrets.S3_SECRET_KEY }}",
              "S3_HOST": "${{ secrets.S3_HOST }}",
              "MYND_DB_PASSWORD": "${{ secrets.MYND_DB_PASSWORD }}",
              "MYND_KC_BACKEND_SECRET": "${{ secrets.MYND_KC_BACKEND_SECRET }}"
            }
          standalone: true
