

services:
  keycloak-database:
    image: postgres:18
    volumes:
      - keycloak_database:/var/lib/postgresql
    environment:
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      POSTGRES_USER: keycloak
      POSTGRES_DB: keycloak
    networks:
      - lernplattform-internal-network

  keycloak:
    image: quay.io/keycloak/keycloak:26.6
    command:
      - start
    depends_on:
      - keycloak-database
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-database
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: true
      KC_HTTP_ENABLED: true
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME: ${KEYCLOAK_URL}
    networks:
      - nginx-proxy-manager
      - lernplattform-internal-network
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8080/health/live || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  s3:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    networks:
      - nginx-proxy-manager
      - lernplattform-internal-network
    volumes:
      - s3_storage:/data
    command: 'server /data --address "0.0.0.0:9000" --console-address "0.0.0.0:9001"'
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 5s
      timeout: 5s
      retries: 5

  mynd-database:
    image: postgres:18
    volumes:
      - mynd_database:/var/lib/postgresql
    environment:
      POSTGRES_PASSWORD: ${MYND_DB_PASSWORD}
      POSTGRES_USER: mynd
      POSTGRES_DB: mynd
    networks:
      - lernplattform-internal-network

  mynd-backend:
    image: ghcr.io/thi-projekte/lernplattform-mynd-backend:latest
    depends_on:
      mynd-database:
        condition: service_started
      keycloak:
        condition: service_healthy
      s3:
        condition: service_healthy
    networks:
      - nginx-proxy-manager
      - lernplattform-internal-network
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8080/q/health/live || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 3
    environment:
      DB_USER: mynd
      DB_PASSWORD: ${MYND_DB_PASSWORD}
      DB_HOST: mynd-database
      DB_NAME: mynd
      KEYCLOAK_URL: keycloak:8080
      KEYCLOAK_REALM: master
      KEYCLOAK_CLIENT_ID: mynd
      KEYCLOAK_BACKEND_CLIENT_ID: mynd-backend
      KEYCLOAK_BACKEND_CLIENT_SECRET: ${MYND_KC_BACKEND_SECRET}
      S3_HOST: ${S3_HOST}
      S3_REGION: local
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET: ${S3_SECRET_KEY}

  mynd-frontend:
    image: ghcr.io/thi-projekte/lernplattform-mynd-frontend:latest
    depends_on:
      keycloak:
        condition: service_healthy
      mynd-backend:
        condition: service_healthy
    networks:
      - nginx-proxy-manager
      - lernplattform-internal-network


volumes:
  keycloak_database:
  mynd_database:
  s3_storage:

networks:
  lernplattform-internal-network:
    driver: bridge
    name: lernplattform-internal-network
    ipam:
      config:
        subnet: 172.20.0.0/16

  nginx-proxy-manager:
    external: true
    name: nginx-proxy-manager
